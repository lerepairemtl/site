# Éditeur de contenu du site (Decap CMS) — https://lerepairemtl.com/admin/
# Chaque publication crée un commit dans le dépôt; Cloudflare reconstruit le site.

backend:
  name: github
  repo: lerepairemtl/site
  branch: v2
  # Authentification GitHub par les fonctions Cloudflare Pages (dossier /functions/api).
  # base_url est fixé dans index.html d'après le domaine courant.
  auth_endpoint: /api/auth
  commit_messages:
    create: 'Contenu : ajout de « {{slug}} »'
    update: 'Contenu : mise à jour de « {{slug}} »'
    delete: 'Contenu : retrait de « {{slug}} »'
    uploadMedia: 'Média : ajout de « {{path}} »'
    deleteMedia: 'Média : retrait de « {{path}} »'

locale: fr
site_url: https://lerepairemtl.com
display_url: https://lerepairemtl.com

media_folder: public/images/nouvelles
public_folder: /images/nouvelles

i18n:
  structure: multiple_folders
  locales: [fr, en]
  default_locale: fr

collections:
  - name: nouvelles
    label: Nouvelles et sorties
    label_singular: Publication
    description: Sorties de cartes, arrivages, événements et nouvelles. Le français est obligatoire; sans version anglaise, le site anglais affiche le français.
    folder: src/content/nouvelles
    create: true
    i18n: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    summary: '{{title}} ({{categorie}}, {{date}})'
    sortable_fields: [date, title, categorie]
    view_filters:
      - { label: Brouillons, field: draft, pattern: true }
      - { label: Sorties, field: categorie, pattern: sortie }
    fields:
      - { name: title, label: Titre, widget: string, i18n: true }
      - name: categorie
        label: Catégorie
        widget: select
        i18n: duplicate
        default: nouvelle
        options:
          - { label: Sortie, value: sortie }
          - { label: Arrivage, value: arrivage }
          - { label: Événement, value: evenement }
          - { label: Nouvelle, value: nouvelle }
      - { name: date, label: Date de publication, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false, i18n: duplicate }
      - { name: resume, label: Résumé, hint: 'Une ou deux phrases, 240 caractères au plus. Sert aussi aux réseaux sociaux. Facultatif pour une sortie qui ne va qu’au calendrier.', widget: text, required: false, pattern: ['^[\s\S]{0,240}$', '240 caractères au plus'], i18n: true }
      - name: famille
        label: Famille de produits
        hint: Donne sa couleur à la publication.
        widget: select
        required: false
        i18n: duplicate
        options:
          - { label: Cartes sportives, value: sport }
          - { label: Jeux de cartes à collectionner, value: jcc }
          - { label: Briques et maquettes, value: briques }
          - { label: Jeux de société, value: jeux }
          - { label: Pièces de collection, value: collection }
      - { name: univers, label: Univers, hint: 'Ex. Hockey, Pokémon, One Piece, Lego.', widget: string, required: false, i18n: duplicate }
      - { name: date_sortie, label: Date de sortie, hint: 'Sortie seulement : place le produit dans le calendrier. Le titre = le nom du produit.', widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false, required: false, i18n: duplicate }
      - { name: image, label: Image, widget: image, required: false, i18n: duplicate }
      - { name: image_alt, label: "Description de l'image", hint: 'Pour les lecteurs d’écran.', widget: string, required: false, i18n: true }
      - { name: dans_nouvelles, label: Aussi dans Nouvelles, hint: 'Sortie seulement. Décoché : la sortie n’apparaît que dans le calendrier. Coché : elle est aussi publiée dans Nouvelles, à l’accueil et dans le flux RSS.', widget: boolean, default: false, required: false, i18n: duplicate }
      - { name: draft, label: Brouillon, hint: 'Coché : la publication reste hors ligne.', widget: boolean, default: false, i18n: duplicate }
      - { name: body, label: Texte, hint: 'Facultatif pour une sortie légère.', widget: markdown, required: false, i18n: true }
